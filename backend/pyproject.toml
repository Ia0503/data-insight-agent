[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newai-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "sqlalchemy==2.1.3", "psycopg[binary]==3.3.6",
  "alembic==1.20.0", "pydantic-settings==2.15.0", "python-multipart==0.0.32", "pandas==3.0.6", "pypdf==6.19.0",
  "pgvector==0.5.0", "transformers==4.57.6", "torch==2.14.1+cpu",
  "langgraph==1.2.13", "httpx==0.28.1"
]

[tool.setuptools.packages.find]
include = ["app*"]
