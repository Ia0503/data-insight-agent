worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format concise '$request_id $request_method $uri $status';
    access_log /dev/stdout concise;
    sendfile on;
    server_tokens off;
    client_max_body_size 101m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $request_method $analysis_client { default ""; POST $binary_remote_addr; }
    limit_req_zone $analysis_client zone=analysis_requests:10m rate=10r/m;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        set $api_backend http://backend:8000;
        location ~ ^/api/projects/[^/]+/agent/runs/?$ {
            limit_req zone=analysis_requests burst=10 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy-common.conf;
            proxy_pass $api_backend;
        }
        location /api/ {
            include /etc/nginx/proxy-common.conf;
            proxy_pass $api_backend;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
